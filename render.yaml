# Free testing deployment using Render PostgreSQL for persistent app data.

services:
  - type: web
    name: queue-context
    runtime: docker
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz

    envVars:
      - key: QUEUE_CONTEXT_USERNAME
        value: owner

      - key: QUEUE_CONTEXT_PASSWORD
        sync: false

      - key: RIOT_API_KEY
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: queue-context-db
          property: connectionString

databases:
  - name: queue-context-db
    plan: free
    databaseName: queue_context
    user: queue_context
