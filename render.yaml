# Free testing deployment.
# SQLite data is temporary and can be lost whenever Render restarts,
# redeploys, or spins down the service.

services:
  - type: web
    name: queue-context
    runtime: docker
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz

    envVars:
      - key: QUEUE_CONTEXT_USERNAME
        value: owner

      - key: QUEUE_CONTEXT_PASSWORD
        sync: false

      - key: QUEUE_CONTEXT_DATA_DIR
        value: /var/data
