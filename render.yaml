# Single-user hosted workspace. Review the paid service and disk cost in Render.
services:
  - type: web
    name: queue-context
    runtime: docker
    plan: 1c-2g
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    disk:
      name: queue-context-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: QUEUE_CONTEXT_USERNAME
        value: owner
      - key: QUEUE_CONTEXT_PASSWORD
        sync: false
      - key: QUEUE_CONTEXT_DATA_DIR
        value: /var/data
